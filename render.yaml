services:
  - type: web
    name: throwdown
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /how
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: throwdown-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: throwdown-db
    plan: basic-256mb
